# Netrunner theme — kitty overrides.
#
# Omarchy normally generates this file from the kitty.conf.tpl template,
# pulling all colors from colors.toml. This file overrides that generation:
# it ships the full netrunner palette inline so it can layer extra
# aesthetic settings (font, padding, tabs, visual bell) on top without
# breaking the include chain. The colors below are kept in sync with
# colors.toml — change both together.

# --- palette (mirrors colors.toml) -----------------------------------------
foreground   #d4f5e0
background   #060606
selection_foreground   #e6ffeb
selection_background   #0f2a1f

cursor       #e6ffeb
cursor_text_color  #060606

active_border_color  #00ff9f
active_tab_background  #00ff9f

color0   #060606
color1   #ff2a6e
color2   #00ff9f
color3   #fcee0a
color4   #0055ff
color5   #ff10f0
color6   #00f0ff
color7   #d4f5e0
color8   #1a332a
color9   #ff5c9f
color10  #39ffbf
color11  #fff05c
color12  #3377ff
color13  #ff5cee
color14  #5cffff
color15  #e6ffeb

# --- netrunner aesthetic ----------------------------------------------------
# A bit more breathing room around dense terminal output.
window_padding_width 16

# Slightly larger body text for the green-on-black look.
font_size 10.0

# Bottom powerline tab bar styled with the neon accent.
tab_bar_edge                  bottom
tab_bar_style                 powerline
tab_powerline_style           slanted
tab_title_template            {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
active_tab_background         #00ff9f
active_tab_foreground         #060606
inactive_tab_background       #0f1110
inactive_tab_foreground       #4a6b5a
tab_bar_background            #030303

# A barely-there visual bell: a single frame of neon cyan across the window.
# No audible beep, so it survives in noise-sensitive contexts.
enable_audio_bell    no
visual_bell_color    #00f0ff
bell_on_tab           no
